<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <g fill="#5d4037" fill-opacity="0.08">
    <!-- Собачья лапка (большая) -->
    <g transform="translate(100, 100) rotate(15) scale(1.2)">
      <ellipse cx="0" cy="10" rx="12" ry="14" />
      <ellipse cx="-14" cy="-8" rx="6" ry="9" transform="rotate(-20 -14 -8)" />
      <ellipse cx="-5" cy="-18" rx="6" ry="9" />
      <ellipse cx="5" cy="-18" rx="6" ry="9" />
      <ellipse cx="14" cy="-8" rx="6" ry="9" transform="rotate(20 14 -8)" />
    </g>

    <!-- Кошачья лапка (средняя) -->
    <g transform="translate(350, 150) rotate(-25) scale(0.9)">
      <ellipse cx="0" cy="8" rx="10" ry="11" />
      <ellipse cx="-10" cy="-6" rx="5" ry="7" transform="rotate(-15 -10 -6)" />
      <ellipse cx="0" cy="-12" rx="5" ry="7" />
      <ellipse cx="10" cy="-6" rx="5" ry="7" transform="rotate(15 10 -6)" />
    </g>

    <!-- Птичья лапка -->
    <g transform="translate(500, 400) rotate(45) scale(0.8)">
      <path d="M 0 0 L -8 -20 M 0 0 L 0 -22 M 0 0 L 8 -20" stroke="#5d4037" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="0" r="4" />
    </g>

    <!-- Еще собачья лапка -->
    <g transform="translate(200, 450) rotate(-60) scale(1)">
      <ellipse cx="0" cy="10" rx="12" ry="14" />
      <ellipse cx="-14" cy="-8" rx="6" ry="9" transform="rotate(-20 -14 -8)" />
      <ellipse cx="-5" cy="-18" rx="6" ry="9" />
      <ellipse cx="5" cy="-18" rx="6" ry="9" />
      <ellipse cx="14" cy="-8" rx="6" ry="9" transform="rotate(20 14 -8)" />
    </g>

    <!-- Еще кошачья лапка -->
    <g transform="translate(50, 350) rotate(80) scale(0.8)">
      <ellipse cx="0" cy="8" rx="10" ry="11" />
      <ellipse cx="-10" cy="-6" rx="5" ry="7" transform="rotate(-15 -10 -6)" />
      <ellipse cx="0" cy="-12" rx="5" ry="7" />
      <ellipse cx="10" cy="-6" rx="5" ry="7" transform="rotate(15 10 -6)" />
    </g>

    <!-- Еще птичья лапка -->
    <g transform="translate(450, 50) rotate(-10) scale(0.7)">
      <path d="M 0 0 L -8 -20 M 0 0 L 0 -22 M 0 0 L 8 -20" stroke="#5d4037" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="0" r="4" />
    </g>
    
    <!-- Добавляем еще несколько для плотности -->
    <g transform="translate(300, 300) rotate(120) scale(0.9)">
      <ellipse cx="0" cy="10" rx="12" ry="14" />
      <ellipse cx="-14" cy="-8" rx="6" ry="9" transform="rotate(-20 -14 -8)" />
      <ellipse cx="-5" cy="-18" rx="6" ry="9" />
      <ellipse cx="5" cy="-18" rx="6" ry="9" />
      <ellipse cx="14" cy="-8" rx="6" ry="9" transform="rotate(20 14 -8)" />
    </g>
    
    <g transform="translate(550, 250) rotate(-80) scale(0.8)">
      <ellipse cx="0" cy="8" rx="10" ry="11" />
      <ellipse cx="-10" cy="-6" rx="5" ry="7" transform="rotate(-15 -10 -6)" />
      <ellipse cx="0" cy="-12" rx="5" ry="7" />
      <ellipse cx="10" cy="-6" rx="5" ry="7" transform="rotate(15 10 -6)" />
    </g>

    <g transform="translate(150, 550) rotate(30) scale(0.6)">
      <path d="M 0 0 L -8 -20 M 0 0 L 0 -22 M 0 0 L 8 -20" stroke="#5d4037" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="0" r="4" />
    </g>
  </g>
</svg>