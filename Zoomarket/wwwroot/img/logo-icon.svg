<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <!-- Зеленый круг -->
  <circle cx="50" cy="50" r="48" fill="#4a7c59" />
  
  <g transform="translate(50, 52) scale(0.7) translate(-50, -50)">
    <!-- Пальчики (белые) -->
    <ellipse cx="30" cy="42" rx="8" ry="12" transform="rotate(-20 30 42)" fill="#ffffff" />
    <ellipse cx="42" cy="30" rx="8" ry="13" fill="#ffffff" />
    <ellipse cx="58" cy="30" rx="8" ry="13" fill="#ffffff" />
    <ellipse cx="70" cy="42" rx="8" ry="12" transform="rotate(20 70 42)" fill="#ffffff" />
    
    <!-- Сердечко (светло-бежевое или белое) -->
